name: iowap
version: 0.3.0
description: "IOWAP fleet in Hermes Desktop — live statusbar chip (N/M nodes online), draggable fleet pane, full fleet page and a tasks page that submits to any task-type capability and tracks tasks (per-stage dots, result previews, artifacts). Data stays local: read-only probes via the local node-cli against your own IOWAP relay. Agent sessions join through an optional iowap-task bridge into a shared track store. Disclosure — shells out to the node-cli (github.com/iowap-org/iowap-node, install: git clone + pip install -e .) on this machine, reads the node's own token/state files under ~/.relay/ to talk to your IOWAP relay over your LAN, and keeps tracked task ids in ~/.hermes/plugin-data/iowap/task-track-iowap.json; no third-party network calls, no telemetry, no credentials collected. Requires an IOWAP relay (github.com/iowap-org/iowap-server) reachable from this host."
author: Kesuek
kind: desktop
license: MIT
homepage: https://github.com/iowap-org/iowap-hermes-integration
tags: [desktop, fleet, iowap, relay, tasks, statusbar]
